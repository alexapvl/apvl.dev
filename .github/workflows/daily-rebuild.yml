name: daily rebuild

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-rebuild
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 215b9837eb7de1356b5587b7ddf0119e
  CLOUDFLARE_PAGES_PROJECT: apvl-dev

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and wait for Cloudflare deployment
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/deployments"
          body_file="$RUNNER_TEMP/deployment.json"
          max_deploys=2
          max_poll_errors=5

          # Triggers the deploy hook and prints the new deployment id.
          trigger_deploy() {
            local response deployment_id
            if ! response=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --retry-delay 5 -X POST "$CLOUDFLARE_DEPLOY_HOOK"); then
              echo "deploy hook request failed: ${response}" >&2
              return 1
            fi
            echo "$response" >&2
            deployment_id=$(echo "$response" | jq -r '.result.id // empty')
            if [ -z "$deployment_id" ]; then
              echo "deploy hook did not return a deployment id" >&2
              return 1
            fi
            echo "$deployment_id"
          }

          # Returns 0 on success, 1 on a hard failure, 2 when Cloudflare failed
          # the deployment before it started building (worth retrying).
          wait_for_deploy() {
            local id="$1" errors=0 http_code status stage trigger
            for attempt in $(seq 1 60); do
              http_code=$(curl -sS -o "$body_file" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "${api}/${id}") || http_code=000

              if [ "$http_code" != "200" ]; then
                errors=$((errors + 1))
                echo "attempt ${attempt}: status check returned http ${http_code} (${errors}/${max_poll_errors}): $(head -c 500 "$body_file" 2>/dev/null)"
                if [ "$errors" -ge "$max_poll_errors" ]; then
                  echo "status check failed ${max_poll_errors} times in a row"
                  return 1
                fi
                sleep 10
                continue
              fi
              errors=0

              status=$(jq -r '.result.latest_stage.status // empty' "$body_file")
              stage=$(jq -r '.result.latest_stage.name // empty' "$body_file")
              trigger=$(jq -r '.result.deployment_trigger.type // empty' "$body_file")
              echo "attempt ${attempt}: id=${id} trigger=${trigger} stage=${stage} status=${status}"

              if [ "$status" = "success" ] && [ "$stage" = "deploy" ]; then
                echo "deployment succeeded"
                return 0
              fi

              if [ "$status" = "failure" ] && [ "$stage" = "initialize" ]; then
                echo "deployment failed during initialize"
                return 2
              fi

              if [ "$status" = "failure" ] || [ "$status" = "canceled" ]; then
                echo "deployment failed"
                return 1
              fi

              sleep 10
            done

            echo "deployment timed out after 10 minutes"
            return 1
          }

          for deploy in $(seq 1 "$max_deploys"); do
            echo "deploy ${deploy}/${max_deploys}"
            deployment_id=$(trigger_deploy)

            result=0
            wait_for_deploy "$deployment_id" || result=$?

            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            if [ "$result" -ne 2 ]; then
              exit 1
            fi
            if [ "$deploy" -lt "$max_deploys" ]; then
              echo "retrying deployment"
            fi
          done

          echo "deployment failed during initialize ${max_deploys} times"
          exit 1
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
